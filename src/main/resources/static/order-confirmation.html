<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmation - CES Cinema</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/orders.css">
    <script src="/session.js" defer></script>
    <script src="/nav-auth.js" defer></script>
    <script src="/order-confirmation.js" defer></script>
</head>
<body>
<header class="topbar">
    <nav class="nav-shell" aria-label="Primary navigation">
        <a class="brand" href="/index.html" aria-label="CES Cinema home">
            <span class="brand-mark">CES</span>
            <span>CES Cinema</span>
        </a>
        <div class="nav-links">
            <a class="nav-link" href="/index.html">Movies</a>
            <a class="nav-link" href="/orders.html">Orders</a>
            <span id="navAuthSlot" class="nav-auth-slot"></span>
        </div>
    </nav>
</header>

<main class="page orders-page">
    <div id="confirmationError" class="orders-alert hidden" role="alert"></div>

    <section id="confirmationContent" class="confirmation-card hidden">
        <p class="confirmation-check" aria-hidden="true">✓</p>
        <p class="eyebrow">Payment approved</p>
        <h1>Order Confirmed</h1>
        <p class="page-subtitle">Your seats are booked. A confirmation email has been requested.</p>
        <div id="confirmationNumber" class="confirmation-number"></div>

        <dl class="order-details">
            <div><dt>Movie</dt><dd id="movieTitle"></dd></div>
            <div><dt>Showtime</dt><dd id="showtime"></dd></div>
            <div><dt>Showroom</dt><dd id="showroom"></dd></div>
            <div><dt>Seats and tickets</dt><dd id="tickets"></dd></div>
            <div><dt>Payment</dt><dd id="paymentCard"></dd></div>
            <div><dt>Subtotal</dt><dd id="subtotal"></dd></div>
            <div><dt>Tax</dt><dd id="tax"></dd></div>
            <div class="order-total"><dt>Total paid</dt><dd id="total"></dd></div>
        </dl>

        <div class="confirmation-actions">
            <a class="button" href="/orders.html">View Order History</a>
            <a class="button secondary" href="/index.html">Back to Movies</a>
        </div>
    </section>
</main>
</body>
</html>
